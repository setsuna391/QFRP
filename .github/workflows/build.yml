name: 构建 (Windows / Linux)

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Qt 6.8 (MSVC x64)
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.2'
          host: 'windows'
          target: 'desktop'
          arch: 'win64_msvc2022_64'
          cache: false

      - name: 配置
        shell: pwsh
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DQFRP_BUNDLE_FRPC=OFF 2>&1 | Tee-Object -FilePath cmake-log.txt
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: 编译
        shell: pwsh
        run: |
          cmake --build build --config Release --parallel 2>&1 | Tee-Object -FilePath build-log.txt
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: 失败时推送构建日志到仓库
        if: failure()
        shell: pwsh
        run: |
          git config user.name "ci-bot"
          git config user.email "ci-bot@users.noreply.github.com"
          git add cmake-log.txt build-log.txt 2>$null
          git commit -m "CI 日志 [skip ci]" 2>$null
          #tag 触发的运行处于游离 HEAD,必须显式指明推到 main
          git push origin HEAD:main

      - name: 上传诊断日志(失败时)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: debug-logs-windows
          path: |
            cmake-log.txt
            build-log.txt
          if-no-files-found: ignore

      - name: 部署运行时并打包
        shell: pwsh
        run: |
          windeployqt --release --qmldir qml build\bin\Release\QML_FRPC.exe
          Compress-Archive -Path build\bin\Release\* -DestinationPath QFRP-windows-x64.zip

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: QFRP-windows-x64
          path: QFRP-windows-x64.zip

      - name: 发布到 Release(仅 tag 触发)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: QFRP ${{ github.ref_name }}
          body: |
            ## 下载

            - **QFRP-windows-x64.zip**:Windows 10/11 x64,解压后直接运行 `QML_FRPC.exe`
            - **QFRP-x86_64.AppImage**:Linux 通用格式,`chmod +x` 后直接运行(需要桌面环境)
            - Qt 运行库与 frpc 均已内嵌,目标机器无需安装任何依赖

            ## 注意

            - Windows 程序未签名,首次运行 SmartScreen 会警告,点"更多信息 → 仍要运行"即可
            - 内置 frpc 来自 natfrp 官方分发,登录需要你自己的 SakuraFrp 访问 Token
          files: QFRP-windows-x64.zip

  build-linux:
    runs-on: ubuntu-22.04
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Qt 6.8 (GCC x64)
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.2'
          host: 'linux'
          target: 'desktop'
          arch: 'linux_gcc_64'
          cache: true

      - name: 安装构建依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1-mesa-dev libegl1-mesa-dev libgles2-mesa-dev \
            libfuse2 file desktop-file-utils libwayland-dev libxkbcommon-dev libvulkan-dev


      - name: 安装新版 wayland-protocols(qtwayland 6.8 构建要求)
        run: |
          sudo apt-get install -y meson ninja-build
          git clone --depth 1 --branch 1.37 https://gitlab.freedesktop.org/wayland/wayland-protocols.git
          meson setup wp-build wayland-protocols -Dtests=false
          sudo meson install -C wp-build

      - name: 源码编译 qtwayland(官方 Qt 二进制不发布 Wayland 插件)
        shell: bash
        run: |
          set -o pipefail
          #github clone 偶发网络抖动,失败自动重试两次
          git clone --depth 1 --branch v6.8.2 https://github.com/qt/qtwayland.git 2>&1 | tee qtwayland-log.txt || {
            sleep 20
            git clone --depth 1 --branch v6.8.2 https://github.com/qt/qtwayland.git 2>&1 | tee -a qtwayland-log.txt
          } || {
            sleep 40
            git clone --depth 1 --branch v6.8.2 https://github.com/qt/qtwayland.git 2>&1 | tee -a qtwayland-log.txt
          }
          cmake -S qtwayland -B qtwayland-build \
            -DCMAKE_BUILD_TYPE=Release \
            -DFEATURE_vulkan=OFF \
            -DCMAKE_INSTALL_PREFIX="$(qmake -query QT_INSTALL_PREFIX)" 2>&1 | tee -a qtwayland-log.txt
          cmake --build qtwayland-build --parallel 2>&1 | tee -a qtwayland-log.txt
          cmake --install qtwayland-build 2>&1 | tee -a qtwayland-log.txt
          ls "$(qmake -query QT_INSTALL_PLUGINS)"/platforms/ | grep wayland

      - name: 配置
        shell: bash
        run: |
          set -o pipefail
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=/usr -DQFRP_BUNDLE_FRPC=OFF 2>&1 | tee cmake-log.txt
          test ${PIPESTATUS[0]} -eq 0

      - name: 编译
        shell: bash
        run: |
          cmake --build build --parallel 2>&1 | tee build-log-linux.txt
          test ${PIPESTATUS[0]} -eq 0

      - name: 组装 AppDir
        run: |
          cmake --install build --prefix "$GITHUB_WORKSPACE/AppDir/usr"
          mkdir -p AppDir/usr/share/icons/hicolor/256x256/apps
          cp assets/icon.png AppDir/usr/share/icons/hicolor/256x256/apps/qml-frpc.png

      - name: 打包 AppImage
        shell: bash
        run: |
          set -o pipefail
          PLUGINS_DIR=$(qmake -query QT_INSTALL_PLUGINS)
          #Qt 附带的 SQL 驱动插件依赖外部库(libmimerapi 等)且应用不使用 SQL,
          #留着会让 linuxdeployqt 因 ldd 找不到依赖而中止
          rm -rf "$PLUGINS_DIR/sqldrivers"
          curl -sL -o linuxdeployqt.AppImage https://github.com/probonopd/linuxdeployqt/releases/download/continuous/linuxdeployqt-continuous-x86_64.AppImage 2>&1 | tee pkg-log.txt
          chmod +x linuxdeployqt.AppImage
          ./linuxdeployqt.AppImage AppDir/usr/share/applications/qml-frpc.desktop -qmldir=qml -appimage 2>&1 | tee -a pkg-log.txt
          #linuxdeployqt 会把 git 提交哈希拼进文件名,统一改名便于上传和挂 Release
          for f in QFRP-*-x86_64.AppImage; do mv "$f" QFRP-x86_64.AppImage; done
          ls -la QFRP-x86_64.AppImage

      - name: 失败时推送构建日志到仓库
        if: failure()
        run: |
          git config user.name "ci-bot"
          git config user.email "ci-bot@users.noreply.github.com"
          git add pkg-log.txt build-log-linux.txt qtwayland-log.txt 2>/dev/null || true
          git commit -m "CI Linux 构建日志 [skip ci]" || true
          #tag 触发的运行处于游离 HEAD,必须显式指明推到 main
          git push origin HEAD:main

      - name: 上传诊断日志(失败时)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: debug-logs-linux
          path: |
            cmake-log.txt
            qtwayland-log.txt
            pkg-log.txt
            build-log-linux.txt
          if-no-files-found: ignore

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: QFRP-linux-x64
          path: QFRP-x86_64.AppImage

      - name: 发布到 Release(仅 tag 触发)
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          exec > >(tee gh-release-log.txt) 2>&1
          set -e
          ls -la *.AppImage
          #Windows job 通常先建好 Release;万一本 job 先跑完,这里兜底创建
          gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1 || \
            gh release create "${GITHUB_REF_NAME}" --title "QFRP ${GITHUB_REF_NAME}" --notes "QFRP ${{ github.ref_name }}"
          #删除 tag 会让关联的 Release 变回草稿;每次发布强制转正
          gh release edit "${GITHUB_REF_NAME}" --draft=false
          gh release upload "${GITHUB_REF_NAME}" QFRP-x86_64.AppImage --clobber
          sleep 10
          #校验必须带认证:草稿状态的 Release 对匿名 API 不可见
          ASSET_OK=$(curl -s -H "Authorization: Bearer ${{ github.token }}" \
            "https://api.github.com/repos/${{ github.repository }}/releases/tags/${{ github.ref_name }}" \
            | python3 -c "import json,sys; names=[a['name'] for a in json.load(sys.stdin).get('assets',[])]; print('yes' if 'QFRP-x86_64.AppImage' in names else 'no')")
          echo "Release 资产校验: $ASSET_OK"
          if [ "$ASSET_OK" != "yes" ]; then
            exit 1
          fi

      - name: 失败时推送发布日志到仓库
        if: failure() && hashFiles('gh-release-log.txt') != ''
        shell: bash
        run: |
          git config user.name "ci-bot"
          git config user.email "ci-bot@users.noreply.github.com"
          git add -f gh-release-log.txt
          git commit -m "CI 发布日志 [skip ci]" || true
          #tag 触发的运行处于游离 HEAD,必须显式指明推到 main
          git push origin HEAD:main
